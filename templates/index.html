<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Recipe RAG Chatbot</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css" />
    </head>
    <body class="bg-gray-100 p-6">
        <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow-md">
            <h1 class="text-2xl font-bold mb-4">🍳 Recipe Chatbot</h1>
            <div id="chat-box" class="h-96 overflow-y-auto border p-4 mb-4 bg-gray-50 rounded"></div>
            <form id="chat-form" class="flex">
                <input id="user-input" type="text" placeholder="Type ingredients or a recipe idea..." class="flex-grow p-2 border rounded-l" required />
                <button type="submit" class="bg-blue-500 text-white px-4 rounded-r">Send</button>
            </form>
        </div>

        <script>
            const form = document.getElementById('chat-form');
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');

            form.addEventListener('submit', async e => {
                e.preventDefault();
                const userText = input.value;
                appendMessage('You', userText);
                input.value = '';

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: userText })
                });

                const data = await res.json();
                appendMessage('Bot', data.response || data.error);
            });

            function appendMessage(sender, text) {
                const msg = document.createElement('div');
                msg.innerHTML = `<strong>${sender}:</strong> ${text.replace(/\\n/g, '<br>')}`;
                msg.className = 'mb-2';
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        </script>
    </body>
</html>
